syntax = "proto3";

option go_package = ".;proto";
package wordCount; 

service WordCount {
    rpc WordCount(stream WordCountRequest) returns (stream WordCountResponse) {}
}

message WordCountRequest {
    string Message = 1; 
}
message WordCountResponse {
    message WordCountResult {
        string word  = 1; 
        int32  count = 2;  
    }
    repeated WordCountResult ct = 1; 
    string Key = 2; 
}